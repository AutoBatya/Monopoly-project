<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История транзакций</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="logo">
    <img class="logotype" src="svg/Logo.svg" alt="">
    <span class="monopolylogo">MONOPOLY</span>
  </div>
  <div class="headerfirst">
    <div class="profile"><img src="svg/Vector.svg" alt=""></div>
    <div class="moneybutton"><img src="svg/cash.svg" alt=""></div>
    <div class="group"><img src="svg/Vector (1).svg" alt=""></div>
    <div class="chat"><img src="svg/lightning-bolt.svg" alt=""></div>
    <div class="bet"><img src="svg/dice-5.svg" alt=""></div>
  </div>
  <div class="history">
    <div class="historyfirst">
      <span class="historyhead">История транзакций</span>
      <div class="transactions"><div class="userNames"></div></div>
    </div>
    <span class="balance">Баланс:
      <div class="money"></div>
    </span>
  </div>
  <button class="gametable">Игровое поле</button>
</body>
<script src="history transactions.js"></script>
</html>
